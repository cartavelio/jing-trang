name: Java

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['8.0.442+6', '17.0.14+7']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Generate native Ant targets
        # The legacy suite splitter needs Saxon 6.
        # It is a public, checksum-pinned test dependency, not a patched artifact.
        run: |
          curl --fail --location --retry 2 --max-time 120 https://repo.maven.apache.org/maven2/saxon/saxon/6.5.3/saxon-6.5.3.jar -o lib/saxon.jar
          echo '51e47d7d6021939947d9965b9618b9b1fa07506623facf005ded06ca1178fd2a  lib/saxon.jar' | sha256sum --check
          sha256sum --check lib/ant.sha256
          ./ant modbuild
      - name: Pattern unit regressions
        run: java -cp lib/ant-launcher.jar org.apache.tools.ant.launch.Launcher -buildfile modbuild.xml -Dlib.dir=lib mod.pattern.test-unit
      - name: Complete RNG and Trang native suites
        run: >-
          java -cp lib/ant-launcher.jar org.apache.tools.ant.launch.Launcher
          -buildfile modbuild.xml -Dlib.dir=lib
          mod.catalog.test mod.convert-to-xsd.test mod.dtdinst.test mod.infer.test
          mod.nvdl.test mod.pattern.test mod.picl.test mod.regex.test
          mod.rng-jaxp.test mod.rng-schema.test mod.rng-validate.test
          mod.util.test mod.xsd-datatype.test
      - name: Reproducible normal JAR builds and changed-date control
        run: python3 test/reproducible-jars.py --output "$RUNNER_TEMP/jing-reproducibility"
